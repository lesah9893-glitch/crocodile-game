const takeLeadBtn=document.getElementById('take-lead-btn');
const mechanicOverlay=document.getElementById('mechanic-overlay');
const mechanicOverlayEmoji=document.getElementById('mechanic-overlay-emoji');
const mechanicOverlayTitle=document.getElementById('mechanic-overlay-title');
const mechanicOverlaySubtitle=document.getElementById('mechanic-overlay-subtitle');
let myId=null;
let myEmoji=null;
let currentLeaderId=null;
let overlayTimer=null;
let latestPlayers=[];
function updateViewportHeight(){
const h=window.visualViewport?window.visualViewport.height:window.innerHeight;
document.documentElement.style.setProperty('--app-height',`${h}px`);
}
updateViewportHeight();
window.addEventListener('resize',updateViewportHeight);
if(window.visualViewport){
window.visualViewport.addEventListener('resize',()=>{
updateViewportHeight();
setTimeout(()=>scrollChatToBottom(false),50);
});
}
function showMechanicOverlay(title,subtitle='',emoji=''){
mechanicOverlayEmoji.innerText=emoji||'';
mechanicOverlayTitle.innerText=title||'';
mechanicOverlaySubtitle.innerText=subtitle||'';
mechanicOverlay.classList.add('show');
clearTimeout(overlayTimer);
overlayTimer=setTimeout(()=>mechanicOverlay.classList.remove('show'),2300);
}
function scrollChatToBottom(smooth=true){
requestAnimationFrame(()=>{
chatBox.scrollTo({top:chatBox.scrollHeight,behavior:smooth?'smooth':'auto'});
});
}
function showLeaderboard(players){
if(!players||!players.length){
showMechanicOverlay('РЕЙТИНГ','Пока никто не набрал очков','🏆');
return;
}
const medals=['🥇','🥈','🥉'];
const lines=players.slice(0,5).map((p,i)=>`${medals[i]||`${i+1}.`} ${p.name} — ${p.score}`).join('\n');
showMechanicOverlay('ТОП ИГРОКОВ',lines,'🏆');
}
function applyHeat(messageId,level){
if(!messageId)return;
const wrapper=document.querySelector(`[data-message-id="${messageId}"]`);
if(!wrapper)return;
const content=wrapper.querySelector('.msg-content');
if(!content)return;
content.classList.remove('guess-warm','guess-hot');
if(level==='warm')content.classList.add('guess-warm');
if(level==='hot')content.classList.add('guess-hot');
}
function startGameUI(){
menuScreen.style.display='none';
gameScreen.style.display='flex';
setTimeout(()=>scrollChatToBottom(false),50);
}
function updateScoreboard(players){
if(!players)return;
latestPlayers=players;
scoreboardDiv.querySelectorAll('.player-score').forEach(el=>el.remove());
[...players].sort((a,b)=>b.score-a.score).forEach(player=>{
const div=document.createElement('div');
div.classList.add('player-score');
if(player.id===myId)div.style.borderColor='rgba(255,255,255,.55)';
if(player.id===currentLeaderId)div.classList.add('leader');
div.innerText=`${player.name} · ${player.score}`;
scoreboardDiv.insertBefore(div,nameIcon);
});
}
function addMessage(text,type='other',avatar=null,name=null,messageId=null,proximity=null){
const wrapper=document.createElement('div');
wrapper.classList.add('message-wrapper',type);
if(messageId)wrapper.dataset.messageId=messageId;
if(type==='other'&&avatar){
const avatarDiv=document.createElement('div');
avatarDiv.classList.add('msg-avatar');
avatarDiv.innerText=avatar;
wrapper.appendChild(avatarDiv);
}
const contentDiv=document.createElement('div');
contentDiv.classList.add('msg-content',type);
contentDiv.innerText=(name&&type==='other')?`${name}: ${text}`:text;
if(proximity==='warm')contentDiv.classList.add('guess-warm');
if(proximity==='hot')contentDiv.classList.add('guess-hot');
if(messageId&&type==='other'){
contentDiv.style.cursor='pointer';
contentDiv.onclick=function(){
if(currentLeaderId!==myId)return;
let level='warm';
if(contentDiv.classList.contains('guess-warm'))level='hot';
else if(contentDiv.classList.contains('guess-hot'))level='none';
socket.send(JSON.stringify({action:'mark_close',message_id:messageId,level}));
};
}
wrapper.appendChild(contentDiv);
messagesDiv.appendChild(wrapper);
if(messagesDiv.children.length>200)messagesDiv.removeChild(messagesDiv.firstChild);
scrollChatToBottom();
}
function addSystemMessage(text){addMessage(text,'system')}
nameIcon.onclick=()=>namePopup.style.display='flex';
nameSaveBtn.onclick=()=>{
const name=nameInput.value.trim();
if(!name)return;
socket.send(JSON.stringify({action:'set_name',name}));
namePopup.style.display='none';
nameInput.value='';
};
backBtn.onclick=()=>{
gameScreen.style.display='none';
menuScreen.style.display='flex';
};
restartBtn.onclick=()=>socket.send(JSON.stringify({action:'restart_game'}));
skipBtn.onclick=()=>socket.send(JSON.stringify({action:'skip_word'}));
devBtn.onclick=()=>socket.send(JSON.stringify({action:'dev_win'}));
topBtn.onclick=()=>socket.send(JSON.stringify({action:'guess',word:'/top'}));
function showCategoryPicker(callback){
categoryPopup.style.display='flex';
document.querySelectorAll('.cat-btn').forEach(btn=>{
btn.onclick=function(){
categoryPopup.style.display='none';
callback?.(this.dataset.cat);
};
});
}
menuStartBtn.onclick=()=>{
showCategoryPicker(category=>socket.send(JSON.stringify({action:'start_game',category})));
};
menuLeadBtn.onclick=()=>{
showCategoryPicker(category=>socket.send(JSON.stringify({action:'take_lead',category})));
};
takeLeadBtn.onclick=()=>{
showCategoryPicker(category=>socket.send(JSON.stringify({action:'take_lead',category})));
};
socket.onopen=()=>addSystemMessage('РАДИО МОРЕ на связи 🌊');
socket.onerror=error=>console.error('WebSocket error:',error);
socket.onmessage=function(event){
const data=JSON.parse(event.data);
if(data.type==='my_info'){
myId=data.id;
myEmoji=data.emoji;
addSystemMessage(`Вы подключились · ID ${myId}`);
if(data.name)nameInput.placeholder=data.name;
}
else if(data.type==='chat'){
const type=data.player_id===myId?'self':'other';
addMessage(data.message,type,data.emoji,data.name,data.message_id,data.proximity);
}
else if(data.type==='system'){
addSystemMessage(data.message);
}
else if(data.type==='game_start'){
currentLeaderId=data.leader_id;
startGameUI();
addSystemMessage(data.message);
if(data.leader_id===myId){
secretArea.style.display='flex';
}else{
secretArea.style.display='none';
}
updateScoreboard(latestPlayers);
}
else if(data.type==='leader_changed'){
currentLeaderId=data.leader_id;
updateScoreboard(latestPlayers);
showMechanicOverlay('НОВЫЙ ВЕДУЩИЙ',data.name,data.emoji);
}
else if(data.type==='category_changed'){
showMechanicOverlay('КАТЕГОРИЯ',data.category,data.emoji);
}
else if(data.type==='your_word'){
secretArea.style.display='flex';
secretWordSpan.innerText=data.word;
}
else if(data.type==='player_list'){
updateScoreboard(data.players);
}
else if(data.type==='history'){
historyBox.innerHTML='';
data.words.forEach(word=>{
const span=document.createElement('span');
span.innerText=word;
historyBox.appendChild(span);
});
}
else if(data.type==='word_guessed'){
addMessage(`🎉 ${data.message}`,'guessed-anim');
confetti({particleCount:110,spread:75,origin:{y:.58}});
secretArea.style.display='none';
}
else if(data.type==='word_skipped'){
if(data.leader_id!==myId)secretArea.style.display='none';
}
else if(data.type==='top_leader_changed'){
showMechanicOverlay('НОВЫЙ ЛИДЕР',`${data.name} · ${data.score}`,data.emoji||'👑');
}
else if(data.type==='leaderboard'){
showLeaderboard(data.players);
}
else if(data.type==='message_heat'){
applyHeat(data.message_id,data.level);
}
else if(data.type==='game_reset'){
currentLeaderId=null;
secretArea.style.display='none';
takeLeadBtn.style.display='inline-flex';
showMechanicOverlay('НОВАЯ ИГРА','Счёт сброшен','↻');
}
else if(data.type==='leader_left'){
currentLeaderId=null;
secretArea.style.display='none';
takeLeadBtn.style.display='inline-flex';
showMechanicOverlay('НУЖЕН ВЕДУЩИЙ','Кто готов — забирайте эфир','🎙');
}
else if(data.type==='round_stopped'){
currentLeaderId=null;
secretArea.style.display='none';
takeLeadBtn.style.display='inline-flex';
showMechanicOverlay('РАУНД ОКОНЧЕН','Можно выбрать нового ведущего','🎙');
}
else if(data.type==='error'){
addSystemMessage(`Ошибка: ${data.message}`);
}
};
emojiToggle.onclick=()=>emojiContainer.classList.toggle('active');
['🌊','⚓','🐊','🔥','👑','🎙️','😄','😂'].forEach(emoji=>{
const button=document.createElement('span');
button.innerText=emoji;
button.classList.add('emoji-btn');
button.onclick=()=>{
socket.send(JSON.stringify({action:'guess',word:emoji}));
emojiContainer.classList.remove('active');
};
emojiContainer.appendChild(button);
});
function sendCurrentMessage(){
const text=input.value.trim();
if(!text)return;
socket.send(JSON.stringify({action:'guess',word:text}));
input.value='';
}
sendBtn.onclick=sendCurrentMessage;
input.addEventListener('keydown',event=>{
if(event.key==='Enter'){
event.preventDefault();
sendCurrentMessage();
}
});
input.addEventListener('focus',()=>setTimeout(()=>scrollChatToBottom(false),250));
</script>
</body>
</html>
